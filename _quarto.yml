project:
  type: website
  output-dir: docs
  render:
    - "*.qmd"
    - "!slides/"
  resources:
    - "files/"
    - "projects/"
    - "slides/*.html"
    - "slides/*.pdf"
    - "slides/img/"
    - "slides/images/"
    - "slides/libs/"
    - "slides/css/"
    - "slides/*_files/"
    - "slides/*_files/figure-html"

# See https://quarto.org/docs/projects/code-execution.html#freeze
execute:
  freeze: auto  # Re-render only when source changes

bibliography: files/bib/references.bib #revisar!!
csl: files/bib/chicago-author-date.csl
description-meta: "Feminismo de Datos"

website:
  title: "Feminismo de Datos"
  site-url: "https://maitejullian.github.io/Feminismo-de-Datos/" #cambiar!!

  favicon: "/files/log-transparente.png" #revisar

  # twitter-card:
  #  image: "/files/social-image-sp23.png"
  #  card-style: summary_large_image
  #  creator: "@andrewheiss"
    # site: "@andrewheiss"

  open-graph:
    image: "/files/log-transparente.png" # cambiar luego
    locale: es
  
  sidebar:
    - id: main
      style: "docked"
      search: false
      lang: es
      background: "#1E2D59"
      foreground: light
      contents:
        - text: "Programa"
          file: syllabus.qmd
        - section: "Recursos"
          contents:
            - section: "Recursos Web"
              contents:
                - text: "Estadística Descriptiva"
                  file: resource/ed.qmd
                - text: "Uso de R"
                  file: resource/r.qmd
                - text: "Varios"
                  file: resource/varios.qmd
        - icon: cloud-fill
          href: "https://rstudio.cloud"
          aria-label: RStudio.cloud

  page-footer:
    left: |
      Content {{< fa brands creative-commons >}} {{< var course.copyright_year >}} by María Fernanda Núñez <br>
      All content licensed under a {{< fa brands creative-commons >}}
      {{< fa brands creative-commons-by >}} {{< fa brands creative-commons-nc >}}
      [Creative Commons Attribution-NonCommercial 4.0 International license (CC BY-NC 4.0)](https://creativecommons.org/licenses/by-nc/4.0/)
    right: |
      Made with {{< fa brands r-project >}} and [Quarto](https://quarto.org/)<br>
      [View the source at {{< fa brands github >}} GitHub]({{< var course.github >}})

format:
  html:
    theme:
      - litera
      - html/custom.scss
    toc: true
    highlight-style: monokai
